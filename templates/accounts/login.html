{% extends 'base.html' %}
{% block title %}Login - OmniStock POS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-sm bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                <h4 class="fw-bold mt-2">OmniStock Login</h4>
                <p class="text-muted small">Sign in to your POS & Inventory register</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" required autofocus placeholder="e.g. admin">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
            <div class="text-center mt-4 border-top pt-3">
                <span class="text-muted small">Need an account?</span>
                <a href="{% url 'accounts:register' %}" class="small fw-semibold text-decoration-none ms-1">Create Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
